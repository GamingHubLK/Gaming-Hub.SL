<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gaming Hub - 150 Games</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101218;color:#fff;font-family:Arial,sans-serif}header{position:sticky;top:0;z-index:5;background:#191c25;padding:18px;border-bottom:1px solid #303441}.logo{font-size:28px;font-weight:800;color:#00d9ff;margin-bottom:12px}#search{width:min(650px,100%);padding:13px;border-radius:12px;border:1px solid #3b4050;background:#252936;color:#fff;font-size:16px}#cats{display:flex;gap:8px;overflow:auto;margin-top:12px;padding-bottom:3px}.cat{background:#292d39;padding:10px 15px;white-space:nowrap;border:0;color:#fff;border-radius:20px;cursor:pointer}.cat.active,.cat:hover{background:#00a9c7}main{width:min(1200px,94%);margin:25px auto}#count{color:#aeb4c4;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:15px}.card{background:#1c1f28;border:1px solid #303441;border-radius:15px;overflow:hidden;transition:.2s}.card:hover{transform:translateY(-4px);border-color:#00bcd4}.thumb{height:120px;display:grid;place-items:center;font-size:52px;background:linear-gradient(135deg,#252b3b,#171a22)}.info{padding:12px}.info h3{margin:0 0 5px;font-size:16px}.info p{margin:0 0 10px;color:#aeb4c4;font-size:13px}.play,.action{background:#00bcd4;padding:10px 14px;width:100%;font-weight:bold;border:0;color:#fff;border-radius:9px;cursor:pointer}.play:hover,.action:hover{background:#00d9f0}#screen{display:none;position:fixed;inset:0;background:#0c0e13;z-index:20;overflow:auto}.top{position:sticky;top:0;background:#181b23;padding:13px;display:flex;justify-content:space-between;align-items:center}.back{background:#303542;padding:10px 14px;color:#fff;border:0;border-radius:9px;cursor:pointer}#title{font-weight:bold;font-size:19px}#area{width:min(700px,94%);margin:25px auto;text-align:center}canvas{width:100%;max-width:650px;border:2px solid #394052;border-radius:15px;background:#111827;touch-action:none}.score{font-size:18px;margin:12px}.msg{color:#b9c0d0;margin:10px}.action{width:auto;margin:5px}@media(max-width:500px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}.thumb{height:95px;font-size:42px}.info{padding:9px}.info h3{font-size:14px}}
</style></head><body>
<header><div class="logo">🎮 GAMING HUB</div><input id="search" placeholder="🔎 Search 150 games..."><div id="cats"></div></header>
<main><h1>🔥 All Games</h1><div id="count"></div><div class="grid" id="grid"></div></main>
<section id="screen"><div class="top"><button class="back" onclick="closeGame()">⬅ Back</button><div id="title"></div></div><div id="area"></div></section>
<script>
const DATA=[["Road Rush","Racing","🏎️"],["Speed Racer","Racing","🏁"],["Drift King","Racing","🚗"],["Highway Racer","Racing","🛣️"],["Turbo Track","Racing","🏎️"],["Neon Racer","Racing","🌈"],["Desert Race","Racing","🏜️"],["Mountain Race","Racing","⛰️"],["City Race","Racing","🌆"],["Night Racer","Racing","🌙"],["Super Circuit","Racing","🏁"],["Fast Wheels","Racing","🚘"],["Rocket Race","Racing","🚀"],["Mini Racer","Racing","🏎️"],["Traffic Racer","Racing","🚦"],["Speed Battle","Racing","⚡"],["Track Master","Racing","🏆"],["Grand Race","Racing","🥇"],["Street Racer","Racing","🛞"],["Ultimate Race","Racing","🔥"],["City Driver","Driving","🚗"],["Taxi Driver","Driving","🚕"],["Bus Driver","Driving","🚌"],["Truck Driver","Driving","🚚"],["Police Driver","Driving","🚓"],["Ambulance Driver","Driving","🚑"],["Delivery Driver","Driving","📦"],["Parking Master","Driving","🅿️"],["Offroad Driver","Driving","🚙"],["Jeep Adventure","Driving","🚙"],["Car Stunt","Driving","🤸"],["Bridge Driver","Driving","🌉"],["Airport Driver","Driving","✈️"],["School Bus","Driving","🚌"],["Crazy Driver","Driving","😵"],["Super Runner","Running","🏃"],["Jungle Run","Running","🌴"],["Ninja Run","Running","🥷"],["Robot Run","Running","🤖"],["City Runner","Running","🌆"],["Ice Runner","Running","❄️"],["Fire Runner","Running","🔥"],["Space Runner","Running","🚀"],["Temple Run Mini","Running","🏛️"],["Desert Runner","Running","🏜️"],["Speed Runner","Running","⚡"],["Monster Run","Running","👾"],["Sky Runner","Running","☁️"],["Cave Runner","Running","🪨"],["Ultimate Runner","Running","🏆"],["Puzzle Master","Puzzle","🧩"],["Number Puzzle","Puzzle","🔢"],["Color Match","Puzzle","🎨"],["Memory Match","Puzzle","🧠"],["Block Puzzle","Puzzle","🟦"],["2048 Mini","Puzzle","🔢"],["Word Puzzle","Puzzle","🔤"],["Shape Match","Puzzle","🔷"],["Math Challenge","Puzzle","➗"],["Quick Count","Puzzle","🔢"],["Tile Master","Puzzle","🟩"],["Pattern Puzzle","Puzzle","🔶"],["Brain Blocks","Puzzle","🧱"],["Find The Odd","Puzzle","🔍"],["Logic Puzzle","Puzzle","💡"],["Number Rush","Puzzle","🔢"],["Puzzle Box","Puzzle","📦"],["Smart Match","Puzzle","🧠"],["Quick Puzzle","Puzzle","⚡"],["Puzzle Challenge","Puzzle","🏆"],["Brain Test","Brain","🧠"],["Quick Think","Brain","💡"],["Memory King","Brain","🧠"],["Logic Master","Brain","🔐"],["Smart Numbers","Brain","🔢"],["Think Fast","Brain","⚡"],["Brain Challenge","Brain","🎯"],["Pattern Master","Brain","🔷"],["Mind Game","Brain","🧠"],["Focus Test","Brain","👀"],["Fast Brain","Brain","⚡"],["Smart Choice","Brain","🤔"],["Memory Rush","Brain","🧠"],["Logic Rush","Brain","💡"],["Ultimate Brain","Brain","🏆"],["Football Star","Sports","⚽"],["Basketball Pro","Sports","🏀"],["Tennis Champion","Sports","🎾"],["Cricket Hero","Sports","🏏"],["Boxing Champion","Sports","🥊"],["Golf Master","Sports","⛳"],["Penalty King","Sports","⚽"],["Basketball Shot","Sports","🏀"],["Tennis Hit","Sports","🎾"],["Cricket Hit","Sports","🏏"],["Football Kick","Sports","⚽"],["Hockey Star","Sports","🏒"],["Baseball Hit","Sports","⚾"],["Sports Challenge","Sports","🏆"],["Ultimate Sports","Sports","🥇"],["Space Dodge","Arcade","🚀"],["Alien Attack","Arcade","👽"],["Meteor Blast","Arcade","☄️"],["Coin Catcher","Arcade","🪙"],["Bubble Pop","Arcade","🫧"],["Cannon Hero","Arcade","💥"],["Jump Hero","Arcade","🦸"],["Star Catcher","Arcade","⭐"],["Laser Dodge","Arcade","🔴"],["Ball Bounce","Arcade","⚽"],["Box Breaker","Arcade","🧱"],["Rocket Blast","Arcade","🚀"],["Monster Attack","Arcade","👾"],["Pixel Fighter","Arcade","🎮"],["Danger Zone","Arcade","⚠️"],["Treasure Hunt","Arcade","💎"],["Fire Ball","Arcade","🔥"],["Ice Blast","Arcade","❄️"],["Arcade Rush","Arcade","🕹️"],["Ultimate Arcade","Arcade","🏆"],["Space Pilot","Space","🚀"],["Galaxy Shooter","Space","🌌"],["Asteroid Hunter","Space","☄️"],["Moon Mission","Space","🌙"],["Mars Mission","Space","🔴"],["Star Explorer","Space","⭐"],["Cosmic Run","Space","🌌"],["Rocket Mission","Space","🚀"],["Alien Escape","Space","👽"],["Galaxy Master","Space","🌠"],["Farm Simulator","Simulation","🚜"],["City Builder","Simulation","🏙️"],["Restaurant Sim","Simulation","🍔"],["Airport Manager","Simulation","✈️"],["Train Simulator","Simulation","🚆"],["Shop Manager","Simulation","🛒"],["Pet Simulator","Simulation","🐶"],["Fishing Simulator","Simulation","🎣"],["Park Builder","Simulation","🌳"],["Factory Manager","Simulation","🏭"],["Ball Catch","Casual","⚽"],["Tap Challenge","Casual","👆"],["Color Tap","Casual","🎨"],["Coin Collector","Casual","🪙"],["Jump Ball","Casual","🔵"],["Avoid It","Casual","🚧"],["Quick Tap","Casual","⚡"],["Target Hit","Casual","🎯"],["Lucky Box","Casual","🎁"],["Casual Master","Casual","🏆"]],grid=document.getElementById('grid'),count=document.getElementById('count'),search=document.getElementById('search'),cats=document.getElementById('cats');let cat='All',current=null,running=false,raf=0,keys={},score=0;
document.onkeydown=e=>keys[e.key.toLowerCase()]=true;document.onkeyup=e=>keys[e.key.toLowerCase()]=false;
function makeCats(){['All',...new Set(DATA.map(x=>x[1]))].forEach(c=>{let b=document.createElement('button');b.className='cat'+(c==='All'?' active':'');b.textContent=c;b.onclick=()=>{cat=c;document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()};cats.appendChild(b)})}
function render(){let q=search.value.toLowerCase(),a=DATA.filter(x=>(cat==='All'||x[1]===cat)&&(x[0].toLowerCase().includes(q)||x[1].toLowerCase().includes(q)));count.textContent=a.length+' games available';grid.innerHTML=a.map(x=>`<article class="card"><div class="thumb">${x[2]}</div><div class="info"><h3>${x[0]}</h3><p>${x[1]}</p><button class="play" onclick="openGame(${DATA.indexOf(x)})">▶ Play</button></div></article>`).join('')}
search.oninput=render;
function openGame(i){current=DATA[i];running=true;score=0;screen.style.display='block';title.textContent=current[2]+' '+current[0];area.innerHTML='';engine(current[1])}
function closeGame(){running=false;cancelAnimationFrame(raf);screen.style.display='none'}
function restart(){let x=current;closeGame();setTimeout(()=>{current=x;running=true;screen.style.display='block';title.textContent=x[2]+' '+x[0];area.innerHTML='';engine(x[1])},50)}
function base(msg){area.innerHTML=`<div class="score">Score: <span id="s">0</span></div><canvas id="cv" width="600" height="420"></canvas><div class="msg">${msg}</div><button class="action" onclick="restart()">🔄 Restart</button>`}
function setScore(){let s=document.getElementById('s');if(s)s.textContent=Math.floor(score)}
function engine(c){if(c==='Racing'||c==='Driving')race();else if(c==='Running')run();else if(c==='Sports')sport();else if(c==='Space'||c==='Arcade')dodge();else if(c==='Puzzle'||c==='Brain')puzzle();else if(c==='Simulation')sim();else casual()}
function race(){base('Use ← → or A/D. Avoid cars!');let x=cv.getContext('2d'),p={x:280,y:340,w:45,h:65},obs=[];let t=setInterval(()=>obs.push({x:80+Math.random()*440,y:-70,w:45,h:65}),850);function loop(){if(!running){clearInterval(t);return}x.fillStyle='#242830';x.fillRect(0,0,600,420);x.fillStyle='#555';x.fillRect(65,0,470,420);x.fillStyle='#fff';for(let y=0;y<420;y+=65)x.fillRect(292,y,16,35);if(keys.arrowleft||keys.a)p.x-=6;if(keys.arrowright||keys.d)p.x+=6;p.x=Math.max(70,Math.min(485,p.x));x.fillStyle='#00d9ff';x.fillRect(p.x,p.y,p.w,p.h);obs.forEach(o=>{o.y+=5;x.fillStyle='#ff4757';x.fillRect(o.x,o.y,o.w,o.h);if(p.x<o.x+o.w&&p.x+p.w>o.x&&p.y<o.y+o.h&&p.y+p.h>o.y){running=false;clearInterval(t);alert('Game Over! Score: '+Math.floor(score))}});obs=obs.filter(o=>o.y<450);score+=.1;setScore();raf=requestAnimationFrame(loop)}loop()}
function run(){base('Press SPACE/↑ or tap to jump.');let x=cv.getContext('2d'),p={x:80,y:300,w:42,h:58,v:0,j:false},obs=[];function jump(){if(!p.j){p.v=-13;p.j=true}}cv.onpointerdown=jump;let t=setInterval(()=>obs.push({x:610,y:320,w:30,h:40}),1000);function loop(){if(!running){clearInterval(t);return}x.fillStyle='#152238';x.fillRect(0,0,600,420);x.fillStyle='#3a8f3a';x.fillRect(0,360,600,60);if(keys[' ']||keys.arrowup)jump();p.v+=.7;p.y+=p.v;if(p.y>=300){p.y=300;p.v=0;p.j=false}x.fillStyle='#00d9ff';x.fillRect(p.x,p.y,p.w,p.h);obs.forEach(o=>{o.x-=5;x.fillStyle='#ff7043';x.fillRect(o.x,o.y,o.w,o.h);if(p.x<o.x+o.w&&p.x+p.w>o.x&&p.y<o.y+o.h&&p.y+p.h>o.y){running=false;clearInterval(t);alert('Game Over! Score: '+Math.floor(score))}});obs=obs.filter(o=>o.x>-50);score+=.1;setScore();raf=requestAnimationFrame(loop)}loop()}
function dodge(){base('Use ← → or A/D. Dodge falling objects.');let x=cv.getContext('2d'),p={x:280,y:360},o=[];let t=setInterval(()=>o.push({x:Math.random()*580,y:-20,r:15+Math.random()*15,v:3+Math.random()*3}),450);function loop(){if(!running){clearInterval(t);return}x.fillStyle='#080b18';x.fillRect(0,0,600,420);x.fillStyle='white';for(let i=0;i<35;i++)x.fillRect(i*71%600,i*37%400,2,2);if(keys.arrowleft||keys.a)p.x-=7;if(keys.arrowright||keys.d)p.x+=7;p.x=Math.max(10,Math.min(550,p.x));x.fillStyle='#00e5ff';x.fillRect(p.x,365,40,25);o.forEach(a=>{a.y+=a.v;x.fillStyle='#ff4757';x.beginPath();x.arc(a.x,a.y,a.r,0,7);x.fill();if(Math.abs(a.x-(p.x+20))<a.r+20&&Math.abs(a.y-375)<a.r+20){running=false;clearInterval(t);alert('Game Over! Score: '+Math.floor(score))}});o=o.filter(a=>a.y<450);score+=.1;setScore();raf=requestAnimationFrame(loop)}loop()}
function sport(){base('Tap the target!');let x=cv.getContext('2d'),tx=300,ty=210;function draw(){x.fillStyle='#173b25';x.fillRect(0,0,600,420);x.strokeStyle='white';x.strokeRect(20,20,560,380);x.fillStyle='#ffd000';x.beginPath();x.arc(tx,ty,35,0,7);x.fill()}cv.onpointerdown=e=>{let r=cv.getBoundingClientRect(),px=(e.clientX-r.left)*600/r.width,py=(e.clientY-r.top)*420/r.height;if(Math.hypot(px-tx,py-ty)<45){score+=10;setScore();tx=50+Math.random()*500;ty=50+Math.random()*320;draw()}};draw()}
function puzzle(){area.innerHTML='<div class="score">Score: <span id="s">0</span></div><div style="background:#1c2230;padding:30px;border-radius:20px"><h2 id="q"></h2><div id="ans"></div><p id="pm"></p><button class="action" onclick="newQ()">▶ Next</button></div>';newQ()}
function newQ(){let x=Math.floor(Math.random()*20)+1,y=Math.floor(Math.random()*20)+1,a=x+y;q.textContent=x+' + '+y+' = ?';ans.innerHTML='';let z=[a];while(z.length<4){let n=a+Math.floor(Math.random()*15)-7;if(n>0&&!z.includes(n))z.push(n)}z.sort(()=>Math.random()-.5).forEach(n=>{let b=document.createElement('button');b.className='action';b.textContent=n;b.onclick=()=>{if(n===a){score+=10;setScore();pm.textContent='✅ Correct!'}else pm.textContent='❌ Try again!';setTimeout(newQ,350)};ans.appendChild(b)})}
function sim(){area.innerHTML='<div class="score">Coins: <span id="s">0</span></div><div style="background:#202938;padding:35px;border-radius:20px"><h2>🏗️ Simulation</h2><p>Collect coins and build!</p><button class="action" onclick="coin()">🪙 Collect Coin</button><button class="action" onclick="build()">🏗️ Build</button><p id="sm">Start playing!</p></div>';score=0}
function coin(){score++;setScore();sm.textContent='🪙 Coin collected!'}function build(){if(score>=5){score-=5;setScore();sm.textContent='🏗️ Building created!'}else sm.textContent='You need 5 coins.'}
function casual(){base('Tap the moving target!');let x=cv.getContext('2d'),tx=300,ty=210;function draw(){x.fillStyle='#151923';x.fillRect(0,0,600,420);x.fillStyle='#00d9ff';x.beginPath();x.arc(tx,ty,35,0,7);x.fill()}cv.onpointerdown=e=>{let r=cv.getBoundingClientRect(),px=(e.clientX-r.left)*600/r.width,py=(e.clientY-r.top)*420/r.height;if(Math.hypot(px-tx,py-ty)<45){score+=10;setScore();tx=40+Math.random()*520;ty=40+Math.random()*340;draw()}};draw()}
makeCats();render();
</script></body></html>
